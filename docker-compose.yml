services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: asfim
      POSTGRES_USER: asfim
      POSTGRES_PASSWORD: asfim
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    environment:
      DJANGO_DEBUG: "0"
      DATABASE_URL: postgres://asfim:asfim@db:5432/asfim
      POSTGRES_HOST: db
      POSTGRES_DB: asfim
      POSTGRES_USER: asfim
      POSTGRES_PASSWORD: asfim
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data:
